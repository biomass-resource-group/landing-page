name: Live Deploy Verify

# Scheduled workflows are loaded from the default branch. Keeping this monitor
# schedule-only prevents a dispatch-selected ref from gaining issue-write access.
on:
  schedule:
    - cron: "17 14 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      fingerprint: ${{ steps.validate.outputs.fingerprint }}
      outcome: ${{ steps.validate.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Validate live deployment
        id: validate
        shell: bash
        run: |
          set +e
          node ./scripts/validate-live-deploy.mjs 2>&1 | tee live-deploy.log
          status=${PIPESTATUS[0]}
          set -e

          fingerprint="$(sha256sum live-deploy.log | awk '{print $1}')"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## Live deployment verification"
            echo
            echo "~~~text"
            tail -n 100 live-deploy.log
            echo "~~~"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep deployment health fail-closed
        if: steps.validate.outputs.outcome == 'failure'
        run: |
          echo "::error::Live deployment does not match the repository contract."
          exit 1

  reconcile-alert:
    name: Reconcile deployment incident
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      VERIFY_RESULT: ${{ needs.verify.result }}
      FINGERPRINT: ${{ needs.verify.outputs.fingerprint }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Create, deduplicate, or resolve the incident
        shell: bash
        run: |
          set -euo pipefail
          title='[monitor] Live deployment verification failing'
          issue_number="$(
            gh issue list --repo "$REPOSITORY" --state open --limit 100 \
              --json number,title \
              --jq '[.[] | select(.title == "[monitor] Live deployment verification failing")] | first | .number // empty'
          )"

          if [ "$VERIFY_RESULT" != "success" ]; then
            fingerprint="${FINGERPRINT:-verify-$VERIFY_RESULT}"
            marker="<!-- live-deploy-fingerprint:$fingerprint -->"
            body="$marker
          The production deployment does not match the repository contract.

          Latest failing run: $RUN_URL
          Failure fingerprint: $fingerprint

          The verification job remains red; this issue only deduplicates notifications."

            if [ -z "$issue_number" ]; then
              gh issue create --repo "$REPOSITORY" --title "$title" --body "$body"
            else
              issue_history="$(
                gh issue view "$issue_number" --repo "$REPOSITORY" \
                  --json body,comments --jq '.body, .comments[].body'
              )"
              if ! grep -Fq "$marker" <<< "$issue_history"; then
                gh issue comment "$issue_number" --repo "$REPOSITORY" --body "$body"
              fi
            fi
            exit 0
          fi

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$REPOSITORY" --body "Recovered in $RUN_URL. Closing the deployment incident."
            gh issue close "$issue_number" --repo "$REPOSITORY"
          fi
