name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Lighthouse 13 requires Node >=22.19. Keep the CI toolchain exact
          # and compatible instead of running outside its declared engine.
          node-version: 22.19.0
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run validate:dist
      - name: Lighthouse smoke check
        run: |
          npx --yes serve@14.2.6 dist -l 4173 >/tmp/brg-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx --yes wait-on@8.0.5 http://127.0.0.1:4173
          for sample in 1 2 3; do
            npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ --only-categories=performance,accessibility,best-practices,seo --chrome-flags='--headless=new --no-sandbox' --quiet --output=json --output-path="/tmp/brg-lighthouse-${sample}.json"
          done
          node - <<'NODE'
          const fs = require('fs');
          const reports = [1, 2, 3].map((sample) =>
            JSON.parse(fs.readFileSync(`/tmp/brg-lighthouse-${sample}.json`, 'utf8')),
          );
          const thresholds = {
            performance: 0.9,
            accessibility: 1,
            'best-practices': 1,
            seo: 1,
          };
          const median = (values) => {
            const sorted = [...values].sort((left, right) => left - right);
            return sorted[Math.floor(sorted.length / 2)];
          };

          for (const [category, minimum] of Object.entries(thresholds)) {
            const scores = reports.map((report) => report.categories[category].score);
            // Performance is noisy on shared runners, so require the median of
            // three full audits. Binary compliance categories must pass every
            // sample and therefore use the minimum.
            const actual = category === 'performance' ? median(scores) : Math.min(...scores);
            console.log(`${category}: ${scores.join(', ')} (enforced ${actual})`);
            if (actual < minimum) {
              console.error(`${category} score ${actual} is below ${minimum}`);
              process.exit(1);
            }
          }

          console.log('Lighthouse thresholds passed.');
          NODE
