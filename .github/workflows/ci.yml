name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Lighthouse 13 requires Node >=22.19. Keep the CI toolchain exact
          # and compatible instead of running outside its declared engine.
          node-version: 22.19.0
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run validate:dist
      - name: Lighthouse smoke check
        run: |
          # --no-install from origin/main: serve, wait-on and lighthouse are all
          # locked devDependencies installed by `npm ci` above, so resolving them
          # from the lockfile is stricter than the @version pins this branch was
          # fetching at run time, and Dependabot already tracks them.
          #
          # The three-sample loop from this branch is kept: the median step below
          # reads /tmp/brg-lighthouse-${sample}.json by name, so main's
          # single-sample form would leave that step reading files that do not
          # exist. One Lighthouse run is also the flakiest possible measurement.
          npx --no-install serve dist -l 4173 >/tmp/brg-serve.log 2>&1 &
          # $! must be read on the line AFTER the background job, not before it.
          # A merge left this capture above the `serve &` line, so SERVER_PID was
          # empty, the EXIT trap ran `kill` with no argument, and the step exited 2
          # -- after every Lighthouse threshold had already passed 1.0. A teardown
          # that fails a green run is the worst kind of red: it says the gate found
          # something when it found nothing.
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          npx --no-install wait-on http://127.0.0.1:4173
          for sample in 1 2 3; do
            npx --no-install lighthouse http://127.0.0.1:4173/ --only-categories=performance,accessibility,best-practices,seo --chrome-flags='--headless=new --no-sandbox' --quiet --output=json --output-path="/tmp/brg-lighthouse-${sample}.json"
          done
          node - <<'NODE'
          const fs = require('fs');
          const reports = [1, 2, 3].map((sample) =>
            JSON.parse(fs.readFileSync(`/tmp/brg-lighthouse-${sample}.json`, 'utf8')),
          );
          const thresholds = {
            performance: 0.9,
            accessibility: 1,
            'best-practices': 1,
            seo: 1,
          };
          const median = (values) => {
            const sorted = [...values].sort((left, right) => left - right);
            return sorted[Math.floor(sorted.length / 2)];
          };

          for (const [category, minimum] of Object.entries(thresholds)) {
            const scores = reports.map((report) => report.categories[category].score);
            // Performance is noisy on shared runners, so require the median of
            // three full audits. Binary compliance categories must pass every
            // sample and therefore use the minimum.
            const actual = category === 'performance' ? median(scores) : Math.min(...scores);
            console.log(`${category}: ${scores.join(', ')} (enforced ${actual})`);
            if (actual < minimum) {
              console.error(`${category} score ${actual} is below ${minimum}`);
              process.exit(1);
            }
          }

          console.log('Lighthouse thresholds passed.');
          NODE
