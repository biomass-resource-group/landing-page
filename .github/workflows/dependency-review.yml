name: Dependency Review

# This workflow is intended to become a required check. It therefore starts
# for every pull request and publishes the same `dependency-review` context
# even when no dependency manifest changed.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Classify dependency changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files="${RUNNER_TEMP}/dependency-review-pr-files.txt"
          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename' > "${files}"

          relevant=false
          while IFS= read -r path; do
            case "${path}" in
              package.json|package-lock.json|.github/workflows/dependency-review.yml)
                relevant=true
                ;;
            esac
          done < "${files}"

          echo "relevant=${relevant}" >> "${GITHUB_OUTPUT}"
          echo "Dependency-relevant change: ${relevant}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.relevant == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 22.19.0
          cache: npm

      # Review the entire locked tree, including build/audit tools. Install
      # without lifecycle scripts; registry errors and every advisory fail.
      - name: Audit locked dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=low

      - name: Check dependency graph availability
        id: graph
        if: steps.changes.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The full lockfile audit above is required even when the compare API
          # is unavailable (for example, repositories without graph access).
          if gh api "repos/${REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}" \
               --silent >/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Dependency graph is available; running the review." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Dependency graph unavailable"
              echo
              echo "The graph comparison could not run; see the API error above."
              echo "The required full lockfile npm audit completed successfully,"
              echo "including development dependencies at the low severity threshold."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # Add graph-delta review when the service is available.
      - name: Review dependency changes
        if: steps.changes.outputs.relevant == 'true' && steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Report no dependency change
        if: steps.changes.outputs.relevant == 'false'
        run: |
          {
            echo "### Dependency review"
            echo
            echo "No dependency manifest or dependency-review policy changed."
          } >> "${GITHUB_STEP_SUMMARY}"
