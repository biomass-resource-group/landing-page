name: Dependency Review

# This workflow is intended to become a required check. It therefore starts
# for every pull request and publishes the same `dependency-review` context
# even when no dependency manifest changed.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Classify dependency changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files="${RUNNER_TEMP}/dependency-review-pr-files.txt"
          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename' > "${files}"

          relevant=false
          while IFS= read -r path; do
            case "${path}" in
              package.json|package-lock.json|.github/workflows/dependency-review.yml)
                relevant=true
                ;;
            esac
          done < "${files}"

          echo "relevant=${relevant}" >> "${GITHUB_OUTPUT}"
          echo "Dependency-relevant change: ${relevant}"

      - name: Require dependency graph
        id: graph
        if: steps.changes.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Probe the API used by the review. Unavailable review is a failure;
          # do not infer a specific HTTP status or configuration from exit code.
          if gh api "repos/${REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}" \
               --silent >/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Dependency graph is available; running the review." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Dependency review unavailable"
              echo
              echo "The dependency-graph probe failed for \`${REPOSITORY}\`."
              echo "Dependency changes have not been reviewed."
              echo
              echo "Use the command error above to diagnose graph availability or access"
              echo "for the selected workflow token. This check remains failed until"
              echo "the dependency review can complete."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::Dependency graph unavailable; dependency changes remain unreviewed."
            exit 1
          fi

      # The preceding step fails when a relevant change cannot be reviewed.
      - name: Review dependency changes
        if: steps.changes.outputs.relevant == 'true' && steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Report no dependency change
        if: steps.changes.outputs.relevant == 'false'
        run: |
          {
            echo "### Dependency review"
            echo
            echo "No dependency manifest or dependency-review policy changed."
          } >> "${GITHUB_STEP_SUMMARY}"
