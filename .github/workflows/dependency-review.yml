name: Dependency Review

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-review.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/${REPOSITORY}" --jq '.security_and_analysis.dependency_graph.status // "disabled"')"
          if [ "$status" != "enabled" ]; then
            echo "::error::GitHub Dependency Graph must be enabled; refusing to report a successful no-op review."
            exit 1
          fi

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
